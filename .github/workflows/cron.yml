# Frequent cron for Vercel Hobby (whose own cron only runs once a day).
# Repo secrets needed: APP_URL (e.g. https://cheddar.vercel.app) and CRON_SECRET.
name: cron
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  mouse:
    if: github.event.schedule != '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Mouse re-quote
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB_PATH: /api/cron/mouse
        run: bash .github/scripts/cron-call.sh
  churn:
    if: github.event.schedule != '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Churn
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB_PATH: /api/cron/churn
        run: bash .github/scripts/cron-call.sh
  slack-resync:
    if: github.event.schedule != '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Slack resync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB_PATH: /api/cron/slack-resync
        run: bash .github/scripts/cron-call.sh
